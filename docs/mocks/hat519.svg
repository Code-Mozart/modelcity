<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c75f00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="22" font-size="16" font-weight="600" fill="#15171c">The normal S-curve: two bends on a derived middle line M</text><line x1="20.0" y1="76.4" x2="620.0" y2="76.4" stroke="#c75f00" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/><line x1="20.0" y1="271.0" x2="620.0" y2="271.0" stroke="#c75f00" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/><line x1="198.4" y1="44.0" x2="393.0" y2="303.5" stroke="#c75f00" stroke-width="1.8" opacity="1"/><path d="M101.1 76.4 A243.2 243.2 0 0 1 295.7 173.7" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round" opacity="0.3"/><path d="M295.7 173.7 A243.2 243.2 0 0 0 490.3 271.0" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round" opacity="0.3"/><path d="M101.1 76.4 L157.8 76.4" fill="none" stroke="#00796b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M157.8 76.4 A129.7 129.7 0 0 1 261.6 128.3" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M261.6 128.3 L329.7 219.1" fill="none" stroke="#00796b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M329.7 219.1 A129.7 129.7 0 0 0 433.5 271.0" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M433.5 271.0 L490.3 271.0" fill="none" stroke="#00796b" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="222.7" cy="76.4" r="4" fill="#c75f00"/><text x="214.7" y="66.4" font-size="12" fill="#c75f00">k1</text><circle cx="368.6" cy="271.0" r="4" fill="#c75f00"/><text x="376.6" y="287.0" font-size="12" fill="#c75f00">k2</text><circle cx="295.7" cy="173.7" r="3" fill="#15171c"/><text x="303.7" y="165.7" font-size="12" fill="#15171c">J</text><text x="333.7" y="189.7" font-size="12" fill="#c75f00">M</text><line x1="101.1" y1="76.4" x2="135.1" y2="76.4" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="101.1" cy="76.4" r="5" fill="#15171c"/><text x="83.1" y="66.4" font-size="14" font-weight="600" fill="#15171c">A</text><line x1="490.3" y1="271.0" x2="524.3" y2="271.0" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="490.3" cy="271.0" r="5" fill="#15171c"/><text x="472.3" y="261.0" font-size="14" font-weight="600" fill="#15171c">B</text><text x="16" y="417" font-size="12" fill="#5d6472">M comes from A, B and their headings only; nothing is stored. It meets the heading lines at k1 and k2.</text><text x="16" y="434" font-size="12" fill="#5d6472">Both arcs have one radius and sit inside the corners k1 and k2. Pale: the largest radius, the arcs touch at J.</text><text x="16" y="451" font-size="12" fill="#5d6472">Strong: a smaller radius: straight stubs along the heading lines and a straight piece along M (green).</text></svg>