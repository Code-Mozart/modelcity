<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c75f00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="22" font-size="16" font-weight="600" fill="#15171c">The anchored S-curve: the arcs start at the nodes</text><line x1="73.8" y1="98.7" x2="566.2" y2="98.7" stroke="#c75f00" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/><line x1="345.8" y1="415.0" x2="560.0" y2="44.0" stroke="#c75f00" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/><line x1="139.5" y1="415.0" x2="371.8" y2="44.0" stroke="#c75f00" stroke-width="1.8" opacity="1"/><circle cx="183.2" cy="153.4" r="54.7" fill="none" stroke="#5d6472" stroke-width="1" stroke-dasharray="3 3"/><circle cx="354.7" cy="290.2" r="54.7" fill="none" stroke="#5d6472" stroke-width="1" stroke-dasharray="3 3"/><path d="M183.2 98.7 A85.4 85.4 0 0 1 255.6 229.5" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round" opacity="0.3"/><path d="M255.6 229.5 A85.4 85.4 0 1 0 402.1 317.6" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round" opacity="0.3"/><path d="M183.2 98.7 A54.7 54.7 0 0 1 234.1 133.4" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M234.1 133.4 L303.8 310.3" fill="none" stroke="#00796b" stroke-width="4" stroke-linecap="round" opacity="1"/><path d="M303.8 310.3 A54.7 54.7 0 0 0 402.1 317.6" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="337.5" cy="98.7" r="4" fill="#c75f00"/><text x="345.5" y="90.7" font-size="12" fill="#c75f00">k1</text><text x="351.5" y="128.7" font-size="12" fill="#c75f00">M (goes on to k2, far beyond B)</text><line x1="183.2" y1="98.7" x2="217.2" y2="98.7" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="183.2" cy="98.7" r="5" fill="#15171c"/><text x="165.2" y="88.7" font-size="14" font-weight="600" fill="#15171c">A</text><line x1="402.1" y1="317.6" x2="419.1" y2="288.1" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="402.1" cy="317.6" r="5" fill="#15171c"/><text x="384.1" y="307.6" font-size="14" font-weight="600" fill="#15171c">B</text><text x="16" y="447" font-size="12" fill="#5d6472">Here the heading line of B meets M far AHEAD of B (k2 is off the picture), so no S fits inside the corners.</text><text x="16" y="464" font-size="12" fill="#5d6472">The arcs then start at the nodes: each circle (dashed) has its center at distance R on the normal of its node;</text><text x="16" y="481" font-size="12" fill="#5d6472">a straight piece (green) joins the circles, their inner common tangent. Pale: the largest radius.</text></svg>