<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" font-family="system-ui, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c75f00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="24" font-size="16" font-weight="600" fill="#15171c">1. The normal S-curve</text><text x="16" y="46" font-size="12" fill="#5d6472">Two arcs of one radius meet at the inflection point.</text><text x="16" y="63" font-size="12" fill="#5d6472">With a smaller radius straight stubs lead from the nodes to the arcs.</text><path d="M77.5 120.0 A196.9 196.9 0 0 1 235.0 198.8" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round"/><path d="M235.0 198.8 A196.9 196.9 0 0 0 392.5 277.5" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round"/><line x1="77.5" y1="120.0" x2="109.5" y2="120.0" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="77.5" cy="120.0" r="5" fill="#15171c"/><text x="63.5" y="111.0" font-size="13" fill="#15171c">A</text><line x1="392.5" y1="277.5" x2="424.5" y2="277.5" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="392.5" cy="277.5" r="5" fill="#15171c"/><text x="378.5" y="268.5" font-size="13" fill="#15171c">B</text><text x="486" y="24" font-size="16" font-weight="600" fill="#15171c">2. The anchored S-curve (the fallback)</text><text x="486" y="46" font-size="12" fill="#5d6472">For these nodes the widest middle line gives no valid S.</text><text x="486" y="63" font-size="12" fill="#5d6472">The arcs start at the nodes; a straight piece joins them.</text><path d="M643.1 120.0 A48.4 48.4 0 0 1 684.1 194.0" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round"/><path d="M684.1 194.0 A48.4 48.4 0 1 0 766.9 243.9" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round"/><line x1="643.1" y1="120.0" x2="675.1" y2="120.0" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="643.1" cy="120.0" r="5" fill="#15171c"/><text x="629.1" y="111.0" font-size="13" fill="#15171c">A</text><line x1="766.9" y1="243.9" x2="782.9" y2="216.2" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="766.9" cy="243.9" r="5" fill="#15171c"/><text x="752.9" y="234.9" font-size="13" fill="#15171c">B</text><text x="16" y="368" font-size="12" fill="#5d6472">blue and red: the two arcs, same radius. green: straight pieces. orange arrows: the headings of A and B.</text></svg>