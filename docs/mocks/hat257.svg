<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="sans-serif" font-size="14">
  <title>Segments that intersect must intersect fully (^256)</title>
  <rect width="780" height="340" fill="#f2efe9"/>
<g transform="translate(10,10)"><text x="0" y="16" font-weight="bold" fill="#2e9d62">1 valid</text><rect x="10" y="130" width="220" height="40" rx="20" fill="#fff" stroke="#c9cdd3"/><rect x="100" y="40" width="40" height="225" rx="20" fill="#fff" fill-opacity="0.6" stroke="#c9cdd3"/><circle cx="120" cy="245" r="20" fill="none" stroke="#2e9d62" stroke-dasharray="3 3"/><line x1="30" y1="150" x2="210" y2="150" stroke="#15171c" stroke-width="2"/><line x1="120" y1="60" x2="120" y2="245" stroke="#15171c" stroke-width="2"/><circle cx="30" cy="150" r="5" fill="#15171c"/><text x="38" y="142">A</text><circle cx="210" cy="150" r="5" fill="#15171c"/><text x="218" y="142">B</text><circle cx="120" cy="60" r="5" fill="#15171c"/><text x="128" y="52">C</text><circle cx="120" cy="245" r="5" fill="#2e9d62"/><text x="128" y="237">D</text><line x1="190" y1="150" x2="190" y2="245" stroke="#1c4dff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="196" y="201" fill="#1c4dff" font-size="12">d(D, AB)</text></g><g transform="translate(270,10)"><text x="0" y="16" font-weight="bold" fill="#d92a3f">2 invalid: D inside the road</text><rect x="10" y="130" width="220" height="40" rx="20" fill="#fff" stroke="#c9cdd3"/><rect x="100" y="40" width="40" height="135" rx="20" fill="#fff" fill-opacity="0.6" stroke="#c9cdd3"/><circle cx="120" cy="155" r="20" fill="none" stroke="#d92a3f" stroke-dasharray="3 3"/><line x1="30" y1="150" x2="210" y2="150" stroke="#15171c" stroke-width="2"/><line x1="120" y1="60" x2="120" y2="155" stroke="#15171c" stroke-width="2"/><circle cx="30" cy="150" r="5" fill="#15171c"/><text x="38" y="142">A</text><circle cx="210" cy="150" r="5" fill="#15171c"/><text x="218" y="142">B</text><circle cx="120" cy="60" r="5" fill="#15171c"/><text x="128" y="52">C</text><circle cx="120" cy="155" r="5" fill="#d92a3f"/><text x="128" y="147">D</text><line x1="190" y1="150" x2="190" y2="155" stroke="#1c4dff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="196" y="170" fill="#1c4dff" font-size="12">d(D, AB)</text></g><g transform="translate(530,10)"><text x="0" y="16" font-weight="bold" fill="#d92a3f">3 invalid: the cap of D touches</text><rect x="10" y="130" width="220" height="40" rx="20" fill="#fff" stroke="#c9cdd3"/><rect x="100" y="40" width="40" height="162" rx="20" fill="#fff" fill-opacity="0.6" stroke="#c9cdd3"/><circle cx="120" cy="182" r="20" fill="none" stroke="#d92a3f" stroke-dasharray="3 3"/><line x1="30" y1="150" x2="210" y2="150" stroke="#15171c" stroke-width="2"/><line x1="120" y1="60" x2="120" y2="182" stroke="#15171c" stroke-width="2"/><circle cx="30" cy="150" r="5" fill="#15171c"/><text x="38" y="142">A</text><circle cx="210" cy="150" r="5" fill="#15171c"/><text x="218" y="142">B</text><circle cx="120" cy="60" r="5" fill="#15171c"/><text x="128" y="52">C</text><circle cx="120" cy="182" r="5" fill="#d92a3f"/><text x="128" y="174">D</text><line x1="190" y1="150" x2="190" y2="182" stroke="#1c4dff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="196" y="170" fill="#1c4dff" font-size="12">d(D, AB)</text></g>
  <text x="10" y="300">Every segment is a capsule: its lane width wide, with half circles at its ends. The capsules may cross,</text>
  <text x="10" y="320">but the end discs (radius w(CD)/2 around C and D, dashed) must stay outside AB: d(D, AB) &gt;= w(AB)/2 + w(CD)/2.</text>
</svg>
