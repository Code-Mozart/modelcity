<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="14">
  <title>Segments that intersect must intersect fully (^256)</title>
  <rect width="760" height="330" fill="#f2efe9"/>
  <!-- left: valid -->
  <g transform="translate(20,20)">
    <text x="0" y="14" font-weight="bold">valid: C and D are far enough from AB</text>
    <rect x="10" y="130" width="320" height="40" fill="#fff" stroke="#c9cdd3"/>
    <rect x="150" y="40" width="40" height="220" fill="#fff" stroke="#c9cdd3" opacity="0.85"/>
    <line x1="10" y1="150" x2="330" y2="150" stroke="#15171c" stroke-width="2"/>
    <line x1="170" y1="40" x2="170" y2="260" stroke="#15171c" stroke-width="2"/>
    <circle cx="10" cy="150" r="5" fill="#15171c"/><circle cx="330" cy="150" r="5" fill="#15171c"/>
    <circle cx="170" cy="40" r="5" fill="#15171c"/><circle cx="170" cy="260" r="5" fill="#15171c"/>
    <text x="0" y="145">A</text><text x="338" y="145">B</text><text x="178" y="48">C</text><text x="178" y="266">D</text>
    <!-- distances -->
    <line x1="230" y1="40" x2="230" y2="150" stroke="#1c4dff" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="230" y1="150" x2="230" y2="260" stroke="#1c4dff" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="238" y="100" fill="#1c4dff">d(C, AB)</text><text x="238" y="215" fill="#1c4dff">d(D, AB)</text>
    <line x1="270" y1="150" x2="270" y2="130" stroke="#d92a3f" stroke-width="2"/>
    <text x="276" y="127" fill="#d92a3f" font-size="12">w(AB)/2</text>
  </g>
  <!-- right: invalid -->
  <g transform="translate(400,20)">
    <text x="0" y="14" font-weight="bold">invalid: D ends inside the road of AB</text>
    <rect x="10" y="130" width="320" height="40" fill="#fff" stroke="#c9cdd3"/>
    <rect x="150" y="40" width="40" height="125" fill="#fff" stroke="#c9cdd3" opacity="0.85"/>
    <line x1="10" y1="150" x2="330" y2="150" stroke="#15171c" stroke-width="2"/>
    <line x1="170" y1="40" x2="170" y2="165" stroke="#15171c" stroke-width="2"/>
    <circle cx="10" cy="150" r="5" fill="#15171c"/><circle cx="330" cy="150" r="5" fill="#15171c"/>
    <circle cx="170" cy="40" r="5" fill="#15171c"/><circle cx="170" cy="165" r="5" fill="#d92a3f"/>
    <text x="0" y="145">A</text><text x="338" y="145">B</text><text x="178" y="48">C</text><text x="178" y="185" fill="#d92a3f">D</text>
    <line x1="230" y1="165" x2="230" y2="150" stroke="#d92a3f" stroke-width="2"/>
    <text x="238" y="162" fill="#d92a3f">d(D, AB) too small</text>
  </g>
  <text x="20" y="316">Rule: d(C, AB) &gt;= w(AB)/2 + w(CD)/2 and d(D, AB) &gt;= w(AB)/2 + w(CD)/2, for segments that cross and share no node.</text>
</svg>
