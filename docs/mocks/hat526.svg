<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="system-ui, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c75f00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="24" font-size="16" font-weight="600" fill="#15171c">The circle split in halves</text><text x="16" y="46" font-size="12" fill="#5d6472">B mirrors the heading of A: both arcs lie on one circle.</text><text x="16" y="63" font-size="12" fill="#5d6472">The middle straight has no length and no direction, so the</text><text x="16" y="80" font-size="12" fill="#5d6472">circle is cut into two equal halves; the black ring is the cut.</text><path d="M222.5 120.0 A75.0 75.0 0 0 1 297.5 195.0" fill="none" stroke="#1c4dff" stroke-width="4" stroke-linecap="round"/><path d="M297.5 195.0 A75.0 75.0 0 0 1 222.5 270.0" fill="none" stroke="#d92a3f" stroke-width="4" stroke-linecap="round"/><circle cx="297.5" cy="195.0" r="7" fill="none" stroke="#15171c" stroke-width="2"/><line x1="222.5" y1="120.0" x2="254.5" y2="120.0" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="222.5" cy="120.0" r="5" fill="#15171c"/><text x="208.5" y="111.0" font-size="13" fill="#15171c">A</text><line x1="222.5" y1="270.0" x2="190.5" y2="270.0" stroke="#c75f00" stroke-width="2" marker-end="url(#a)"/><circle cx="222.5" cy="270.0" r="5" fill="#15171c"/><text x="208.5" y="261.0" font-size="13" fill="#15171c">B</text></svg>